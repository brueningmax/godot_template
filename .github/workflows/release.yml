# Builds and publishes a release when a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Runs all checks, exports Windows, Linux and Web with export_presets.cfg
# (tools/export.sh), and creates a GitHub Release with the zips attached.
# See docs/TEMPLATE_GUIDE.md -> "Exporting and releases".
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # Keep in sync with GODOT_VERSION in ci.yml.
  GODOT_VERSION: 4.7-stable

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install gdtoolkit
        run: pip install -r requirements-dev.txt

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64-with-templates

      - name: Download Godot and the needed export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot
          # The template bundle is ~1.3 GB; keep only what the presets use.
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/tpl \
            templates/version.txt templates/linux_release.x86_64 \
            templates/windows_release_x86_64.exe templates/windows_release_x86_64_console.exe \
            templates/web_nothreads_release.zip
          dest=~/.local/share/godot/export_templates/$(cat /tmp/tpl/templates/version.txt)
          mkdir -p "$dest" && mv /tmp/tpl/templates/* "$dest/"
          rm -rf /tmp/templates.tpz /tmp/tpl
          ls -la "$dest"

      - name: Run checks
        run: GODOT="$HOME/godot/godot" tools/check.sh

      - name: Export
        run: GODOT="$HOME/godot/godot" tools/export.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/*.zip --title "$GITHUB_REF_NAME" --generate-notes

      - name: Upload export logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: export-logs
          path: build/*.log
          if-no-files-found: ignore
