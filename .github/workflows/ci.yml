# Runs tools/check.sh (format, lint, import, script compile, smoke runs, tests)
# on every pull request and on pushes to main. Run the same checks locally with
# `tools/check.sh`; see docs/TEMPLATE_GUIDE.md -> "CI and releases".
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The one place the CI Godot version is pinned. Keep it in sync with the
  # Godot version in project.godot and the GUT build in addons/gut.
  GODOT_VERSION: 4.7-stable

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true  # no effect unless the game enables Git LFS

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install gdtoolkit
        run: pip install -r requirements-dev.txt

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot

      - name: Run checks
        run: GODOT="$HOME/godot/godot" tools/check.sh

      - name: Upload logs and test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-logs
          path: .godot/check-logs/
          if-no-files-found: ignore
